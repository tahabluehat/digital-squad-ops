---
# cPanel "Git Version Control" deployment for www.digitalsquad.ma (HeberJahiz)
#
# Repository clone : /home/digitsqu/repositories/digital-squad-ops
# Private app code : /home/digitsqu/digitalsquad   (NOT web accessible)
# Public web files : /home/digitsqu/public_html    (shared with other apps)
#
# SAFETY: nothing is ever deleted in public_html. Only this site's own files
# (index.php, .htaccess, favicon.ico, assets/, images/) are copied there.
# /backup-accounting (Dolibarr) and every other folder stay untouched.
# config/config.php and storage/ uploads are never overwritten.
# Uses only /bin/cp and /bin/mkdir (always available on cPanel).
deployment:
  tasks:
    - export APPPATH=/home/digitsqu/digitalsquad
    - export DEPLOYPATH=/home/digitsqu/public_html
    - /bin/mkdir -p $APPPATH/storage/uploads $APPPATH/storage/sessions $APPPATH/storage/cache/htmlpurifier $APPPATH/config
    - /bin/cp -R php-site/app php-site/bin php-site/lib php-site/migrations php-site/templates $APPPATH/
    - /bin/cp php-site/config/config.example.php $APPPATH/config/
    - /bin/cp php-site/public/index.php php-site/public/.htaccess php-site/public/favicon.ico $DEPLOYPATH/
    - /bin/cp -R php-site/public/assets php-site/public/images $DEPLOYPATH/
    - /bin/chmod 750 $APPPATH/storage/uploads $APPPATH/storage/sessions $APPPATH/storage/cache/htmlpurifier
